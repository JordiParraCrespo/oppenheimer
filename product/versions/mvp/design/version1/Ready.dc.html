<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./ds-base.js"></script>
<style>
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
@keyframes op-ring-in{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){[data-anim]{animation-duration:0s!important}}
</style>
</helmet>
<div style="position:relative;min-height:100vh;background:var(--canvas);padding:36px 40px;display:flex;font-family:var(--font-sans);color:var(--fg)">
<span class="op-wordmark" style="position:absolute;top:34px;left:44px;font-size:20px">Oppenheimer<span class="op-wordmark__sub">Console</span></span>
<div style="display:flex;flex:1;gap:48px;max-width:1360px;margin:0 auto;align-items:center">

<div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px 24px">
<div style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:24px">

<div data-anim style="display:flex;flex-direction:column;gap:14px;animation:op-ring-in 320ms cubic-bezier(.16,1,.3,1)">
<span style="display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:980px;border:1.5px solid var(--primary);background:var(--primary-surface);color:var(--primary)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
</span>
<div>
<h1 style="margin:0;font-family:var(--font-display);font-size:38px;font-weight:600;letter-spacing:-0.024em;line-height:1.1">You're all set</h1>
<p style="margin-top:10px;font-size:15px;color:var(--fg-muted);line-height:1.5;text-wrap:pretty">Versio Platform is ready. Start a session and watch every step it takes.</p>
</div>
</div>

<div style="display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border-subtle);border-radius:18px;overflow:hidden">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 18px">
<span style="font-size:13px;color:var(--fg-muted)">Workspace</span>
<span style="font-family:var(--font-mono);font-size:13px">oppenheimer.dev/versio</span>
</div>
<div style="height:1px;background:var(--border-subtle)"></div>
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 18px">
<span style="font-size:13px;color:var(--fg-muted)">Code</span>
<span style="font-family:var(--font-mono);font-size:13px">JordiParraCrespo · 12 repos</span>
</div>
<div style="height:1px;background:var(--border-subtle)"></div>
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 18px">
<span style="font-size:13px;color:var(--fg-muted)">Host</span>
<span style="font-family:var(--font-mono);font-size:13px">mac-studio · macOS 15</span>
</div>
</div>

<a class="op-btn op-btn--primary op-btn--lg op-btn--block" href="./SessionsConsole.dc.html" style="text-decoration:none">Go to the console</a>

</div>
</div>

<div style="flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center">
<div style="position:relative;width:100%;max-width:470px;aspect-ratio:4/5;max-height:82vh;border-radius:20px;overflow:hidden;background:#1d1d1f">
<img src="./assets/imagery/oppenheimer-portrait.png" alt="J. Robert Oppenheimer" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;transition:opacity 700ms cubic-bezier(.4,0,.2,1);opacity:{{ slide0 }}">
<img src="./assets/imagery/oppenheimer-einstein.png" alt="Oppenheimer with Albert Einstein" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transition:opacity 700ms cubic-bezier(.4,0,.2,1);opacity:{{ slide1 }}">
<img src="./assets/imagery/calutron-operators.png" alt="Calutron operators at Oak Ridge" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transition:opacity 700ms cubic-bezier(.4,0,.2,1);opacity:{{ slide2 }}">
<img src="./assets/imagery/oppenheimer-groves.png" alt="Oppenheimer with General Leslie Groves" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;transition:opacity 700ms cubic-bezier(.4,0,.2,1);opacity:{{ slide3 }}">
<img src="./assets/imagery/los-alamos-gate.png" alt="Los Alamos Project main gate" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transition:opacity 700ms cubic-bezier(.4,0,.2,1);opacity:{{ slide4 }}">
<div style="position:absolute;left:0;right:0;bottom:0;padding:24px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.55) 55%,transparent 100%)">
<p style="margin:0;font-size:13px;color:#fff;letter-spacing:-0.006em">{{ caption }}</p>
<div style="display:flex;gap:6px">
<button type="button" aria-label="Slide 1" onClick="{{ go0 }}" style="width:22px;height:3px;border:0;padding:0;border-radius:980px;cursor:pointer;transition:background 220ms;background:{{ dot0 }}"></button>
<button type="button" aria-label="Slide 2" onClick="{{ go1 }}" style="width:22px;height:3px;border:0;padding:0;border-radius:980px;cursor:pointer;transition:background 220ms;background:{{ dot1 }}"></button>
<button type="button" aria-label="Slide 3" onClick="{{ go2 }}" style="width:22px;height:3px;border:0;padding:0;border-radius:980px;cursor:pointer;transition:background 220ms;background:{{ dot2 }}"></button>
<button type="button" aria-label="Slide 4" onClick="{{ go3 }}" style="width:22px;height:3px;border:0;padding:0;border-radius:980px;cursor:pointer;transition:background 220ms;background:{{ dot3 }}"></button>
<button type="button" aria-label="Slide 5" onClick="{{ go4 }}" style="width:22px;height:3px;border:0;padding:0;border-radius:980px;cursor:pointer;transition:background 220ms;background:{{ dot4 }}"></button>
</div>
</div>
</div></div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;system&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;system&quot;,&quot;tsType&quot;:&quot;'system' | 'light' | 'dark'&quot;}}">
class Component extends DCLogic {
  state = { slide: 0 };

  applyTheme() {
    const t = this.props.theme || 'system';
    const dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }
  componentDidUpdate() { this.applyTheme(); }
  componentDidMount() {
    this.applyTheme();
    this._c = setInterval(() => this.setState(s => ({ slide: (s.slide + 1) % 5 })), 5200);
  }
  componentWillUnmount() { clearInterval(this._c); }

  renderVals() {
    const ci = this.state.slide;
    const captions = [
      'J. Robert Oppenheimer, 1946.',
      'With Albert Einstein at the Institute for Advanced Study, 1947.',
      'Calutron operators at Oak Ridge, 1944.',
      'With General Leslie Groves, Los Alamos, 1945.',
      'The Los Alamos Project main gate, 1943.'
    ];
    const go = (n) => () => this.setState({ slide: n });
    const dot = (n) => ci === n ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.35)';
    return {
      slide0: ci === 0 ? 1 : 0,
      slide1: ci === 1 ? 1 : 0,
      slide2: ci === 2 ? 1 : 0,
      slide3: ci === 3 ? 1 : 0,
      slide4: ci === 4 ? 1 : 0,
      dot0: dot(0), dot1: dot(1), dot2: dot(2), dot3: dot(3), dot4: dot(4),
      go0: go(0), go1: go(1), go2: go(2), go3: go(3), go4: go(4),
      caption: captions[ci]
    };
  }
}
</script>
</body>
</html>
