<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session device</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1c1c1a; --muted: #6b6b66; --line: #dcdcd6; --card: #fff; --accent: #2f5bea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #ececea; --muted: #9a9a94; --line: #2c2c2a; --card: #1c1c1b; --accent: #7c9cff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sp { flex: 1; }
  select, input, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px; max-width: 1100px; margin: 0 auto; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .device { display: flex; justify-content: center; }
  .frame { position: relative; border: 10px solid #000; border-radius: 28px; overflow: hidden; background: #000; width: min(360px, 100%); aspect-ratio: 1080 / 2280; touch-action: none; user-select: none; }
  .frame img { width: 100%; height: 100%; display: block; object-fit: contain; -webkit-user-drag: none; }
  .frame .empty { position: absolute; inset: 0; display: grid; place-items: center; color: #aaa; padding: 24px; text-align: center; }
  .dot { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; background: rgba(124,156,255,.45); pointer-events: none; animation: fade .5s forwards; }
  @keyframes fade { to { opacity: 0; transform: scale(1.6); } }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 0; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
  #log { font-family: ui-monospace, monospace; font-size: 12px; max-height: 180px; overflow: auto; margin: 0; white-space: pre-wrap; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Session device</h1>
  <select id="session" aria-label="Session"></select>
</header>
<main>
  <div class="device">
    <div class="frame" id="frame">
      <img id="screen" alt="Live device screen">
      <div class="empty" id="empty">No ready session</div>
    </div>
  </div>
  <aside>
    <div class="card">
      <h2>Session</h2>
      <dl id="meta"></dl>
    </div>
    <div class="card">
      <h2>Buttons</h2>
      <div class="row">
        <button type="button" data-button="back">Back</button>
        <button type="button" data-button="home">Home</button>
        <button type="button" data-button="appSwitch">Apps</button>
      </div>
    </div>
    <div class="card">
      <h2>Type</h2>
      <form class="row" id="type">
        <input id="text" placeholder="Text for the focused field" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
    <div class="card">
      <h2>Input log</h2>
      <pre id="log"></pre>
    </div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
let current = null;

function log(line) {
  const el = $('log');
  el.textContent = `${new Date().toLocaleTimeString()}  ${line}\n${el.textContent.slice(0, 4000)}`;
}

async function refresh() {
  const sessions = await (await fetch('/api/sessions')).json();
  const sel = $('session');
  const prev = sel.value;
  sel.innerHTML = sessions.map((s) => `<option value="${s.id}">${s.id} · ${s.state}</option>`).join('');
  if (sessions.some((s) => s.id === prev)) sel.value = prev;
  const s = sessions.find((x) => x.id === sel.value) || null;
  $('meta').innerHTML = s
    ? `<dt>Device</dt><dd>${s.serial}</dd><dt>State</dt><dd>${s.state}${s.error ? ` — ${s.error}` : ''}</dd><dt>Worktree</dt><dd>${s.worktree}</dd>`
    : '<dt>—</dt><dd>No session</dd>';
  const ready = s && s.state === 'ready';
  if (ready && current !== s.id) {
    current = s.id;
    $('screen').src = `/api/sessions/${encodeURIComponent(s.id)}/stream`;
  } else if (!ready && current) {
    current = null;
    $('screen').removeAttribute('src');
  }
  $('empty').style.display = ready ? 'none' : 'grid';
  $('empty').textContent = s ? `Device ${s.state}…` : 'No session';
}

async function send(input) {
  if (!current) return;
  const t0 = performance.now();
  const res = await fetch(`/api/sessions/${encodeURIComponent(current)}/input`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(input),
  });
  const ms = Math.round(performance.now() - t0);
  log(`${input.kind}${input.button ? ` ${input.button}` : ''} → ${res.status} in ${ms} ms`);
}

const frame = $('frame');
let down = null;
function norm(e) {
  const r = $('screen').getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}
frame.addEventListener('pointerdown', (e) => { down = norm(e); frame.setPointerCapture(e.pointerId); });
frame.addEventListener('pointerup', (e) => {
  if (!down) return;
  const up = norm(e);
  const moved = Math.hypot(up.x - down.x, up.y - down.y) > 0.02;
  const dot = document.createElement('div');
  dot.className = 'dot';
  const r = frame.getBoundingClientRect();
  dot.style.left = `${e.clientX - r.left - 10}px`;
  dot.style.top = `${e.clientY - r.top - 10}px`;
  frame.appendChild(dot);
  setTimeout(() => dot.remove(), 600);
  send(moved ? { kind: 'swipe', x: down.x, y: down.y, toX: up.x, toY: up.y } : { kind: 'tap', x: up.x, y: up.y });
  down = null;
});
for (const b of document.querySelectorAll('[data-button]')) {
  b.addEventListener('click', () => send({ kind: 'button', button: b.dataset.button }));
}
$('type').addEventListener('submit', (e) => { e.preventDefault(); const t = $('text').value; if (t) send({ kind: 'text', text: t }); $('text').value = ''; });
$('session').addEventListener('change', () => { current = null; refresh(); });

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
