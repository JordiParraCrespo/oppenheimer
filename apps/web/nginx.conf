# =============================================================================
# Static delivery for the built SPA
# =============================================================================
# Three things this file is responsible for beyond routing, none of which nginx
# does by default:
#
#   · compression — the official nginx image ships `gzip` commented out, so
#     without the block below the ~1.1MB entry chunk goes over the wire
#     uncompressed instead of ~320KB
#   · caching — nginx sends no `Cache-Control` for static files, only an ETag,
#     so every repeat visit revalidates all ~50 content-hashed chunks
#   · the Content-Security-Policy that `index.html` and `public/theme-init.js`
#     are already written against. They keep the theme bootstrap in a separate
#     file specifically so no inline-script exception is needed; the policy
#     those comments describe is the one below.
#
# `Cache-Control` is computed by this map rather than set in a `location`
# block on purpose: `add_header` at one level *replaces* the inherited set
# instead of extending it, so a `location` that added its own caching header
# would silently drop every security header with it.
map $uri $oppenheimer_cache_control {
    # `index.html`, `/theme-init.js` and `/session-preload.js` carry no hash in
    # their name — a new release reuses the URL, so they must be revalidated.
    default    "no-cache";
    # Everything Vite emits under /assets/ is content-hashed: the URL changes
    # whenever the bytes do, so it can be cached for a year and never checked.
    ~^/assets/ "public, max-age=31536000, immutable";
}

# `Connection: upgrade` only on an actual WebSocket handshake; a plain request
# through the same `location /api` keeps its keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''         close;
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression --------------------------------------------------------
    # `gzip_static` serves the .gz files the Docker build writes next to each
    # asset (compressed at level 9, once, instead of per request); `gzip` is the
    # runtime fallback for anything not precompressed, including proxied /api
    # responses.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    # ---- Caching ------------------------------------------------------------
    add_header Cache-Control $oppenheimer_cache_control always;

    # ---- Security headers ---------------------------------------------------
    # `script-src 'self'` with no 'unsafe-inline': the two bootstrap scripts are
    # same-origin files for exactly this reason.
    #
    # `style-src` has to allow inline styles — React renders a `style` prop as a
    # style attribute, which CSP blocks under a bare 'self', and the chart and
    # drawer components rely on it.
    #
    # `img-src` allows any https origin because avatars come from the OAuth
    # providers; the directive that matters for injected markup is `script-src`.
    #
    # CSP_EXTRA_ORIGINS is substituted at container start (see the Dockerfile).
    # It defaults to the PostHog EU endpoints and needs widening whenever
    # VITE_API_URL points the app at a different origin, or the analytics
    # project lives in another region.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${CSP_EXTRA_ORIGINS}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' ${CSP_EXTRA_ORIGINS}; worker-src 'self' blob:; frame-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Social sign-in navigates away and back, so popups stay allowed.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # Ignored over plain HTTP, which is what makes it safe to send here and let
    # it pass through the TLS terminator. Deliberately without `includeSubDomains`
    # or `preload`: both are commitments for the whole apex domain, not this app.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The attach socket (`/api/v1/relay/attach`) is a WebSocket: the upgrade
        # needs HTTP/1.1 and the two hop-by-hop headers passed through, and a
        # terminal that is quiet for a minute must not be cut off by the default
        # 60 s read timeout. Buffering off so a keystroke's echo is not held.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
