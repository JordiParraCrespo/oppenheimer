<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    The runner's macOS icon: the console's mark (the same as its favicon),
    the white fedora on the ink tile, drawn on Apple's icon grid (an 824 tile
    in a 1024 canvas, so it sits beside other apps at their size).
    scripts/runner/app-icon.mjs renders it into AppIcon.icns.
  -->
  <title>Oppenheimer Runner</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d22"/>
      <stop offset="1" stop-color="#0b0c0f"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <g filter="url(#lift)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
    <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  </g>
  <g fill="#f5f5f5" transform="translate(100 100) scale(12.875) translate(6.4 4) scale(.8)">
    <path d="M16 37 19.3 15.5C20 10.6 23.6 8.6 27.6 10.2L32 12l4.4-1.8c4-1.6 7.6.4 8.3 5.3L48 37Z"/>
    <path d="M3 46.2c0-2.6 6.5-3.3 15-2.9h28c8.5-.4 15 .3 15 2.9C61 51.5 48 55.5 32 55.5S3 51.5 3 46.2Z"/>
  </g>
</svg>
