# The `releases` container's site (../compose.yml), in place of the image's
# default.conf: the same static root, with its own healthcheck kept out of the
# access log. That check fetches install.sh from loopback every 30 s; it was
# every line the container logged but a handful, hiding the hosts that
# actually install or update.
map $remote_addr $oppenheimer_access_log {
    127.0.0.1 0;
    default   1;
}

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log main if=$oppenheimer_access_log;

    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
    }
}
