# The Docker API as Alloy sees it (../../compose.yml, `docker-proxy`): the
# five reads its docker discovery and log source make, and a 403 for
# everything else. A path rule rather than "containers, read-only": a GET on a
# container's /archive or /export is a tar of its filesystem (Postgres's data
# directory, cloudflared's tunnel secret).
#
# Root, to open the socket (root:docker 0660); it listens on the internal
# `docker-api` network only, which Alloy alone joins.
user root;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  upstream docker {
    server unix:/var/run/docker.sock;
  }

  server {
    listen 2375;

    # Optional API version prefix, then exactly these paths. limit_except GET
    # also lets HEAD through (Alloy's ping), and nothing that writes.
    location ~ "^(/v[0-9.]+)?/(_ping|version|networks|containers/json|containers/[0-9a-f]{64}/json|containers/[0-9a-f]{64}/logs)$" {
      limit_except GET {
        deny all;
      }
      proxy_pass http://docker;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # A followed log is one response that stays open.
      proxy_buffering off;
      proxy_read_timeout 1d;
    }

    location / {
      return 403;
    }
  }
}
