apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-runner
  labels:
    app: {{ .Release.Name }}-runner
spec:
  replicas: {{ .Values.runner.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-runner
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-runner
    spec:
      containers:
        - name: runner
          image: {{ .Values.runner.image }}
          ports:
            - containerPort: {{ .Values.runner.port }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-runner-secrets
          env:
            - name: RUNNER_PORT
              value: {{ .Values.runner.port | quote }}
            {{- range $key, $value := .Values.runner.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.runner.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.runner.port }}
            initialDelaySeconds: 2
            periodSeconds: 10
---
# ClusterIP only: the runner is reached by the API inside the cluster and is
# deliberately absent from the ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-runner
spec:
  selector:
    app: {{ .Release.Name }}-runner
  ports:
    - port: {{ .Values.runner.port }}
      targetPort: {{ .Values.runner.port }}
