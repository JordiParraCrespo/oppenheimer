apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app: {{ .Release.Name }}-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image }}
          env:
            - name: API_UPSTREAM
              value: {{ printf "%s-api:%v" .Release.Name .Values.api.port | quote }}
            {{- with .Values.web.cspExtraOrigins }}
            # Origins the nginx Content-Security-Policy admits beyond 'self'.
            # Unset leaves the image default (the PostHog EU endpoints).
            - name: CSP_EXTRA_ORIGINS
              value: {{ . | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.web.port }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  selector:
    app: {{ .Release.Name }}-web
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
