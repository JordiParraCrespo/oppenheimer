api:
  image: ghcr.io/your-org/oppenheimer-api:latest
  replicas: 1
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    NODE_ENV: production
    BETTER_AUTH_URL: https://oppenheimer.dev
    FRONTEND_URL: https://oppenheimer.dev
    # oppenheimer:begin admin-web
    ADMIN_FRONTEND_URL: https://control.oppenheimer.dev
    # oppenheimer:end admin-web
    # oppenheimer:begin mobile
    MOBILE_SCHEME: oppenheimer
    # oppenheimer:end mobile
    # oppenheimer:begin admin-mobile
    ADMIN_MOBILE_SCHEME: oppenheimer-admin
    # oppenheimer:end admin-mobile
    DB_HOST: oppenheimer-postgres
    DB_PORT: "5432"
    REDIS_HOST: oppenheimer-redis
    REDIS_PORT: "6379"

# oppenheimer:begin web
web:
  # Extra origins for the nginx Content-Security-Policy (space separated).
  # Empty keeps the image default: the PostHog EU endpoints. Widen it when
  # analytics lives in another region, or VITE_API_URL points the bundle at an
  # origin other than the one serving it.
  cspExtraOrigins: ""
  image: ghcr.io/your-org/oppenheimer-web:latest
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
# oppenheimer:end web

# oppenheimer:begin admin-web
adminWeb:
  # Extra origins for the nginx Content-Security-Policy (space separated).
  # Empty keeps the image default: the PostHog EU endpoints. Widen it when
  # analytics lives in another region, or VITE_API_URL points the bundle at an
  # origin other than the one serving it.
  cspExtraOrigins: ""
  image: ghcr.io/your-org/oppenheimer-admin-web:latest
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
# oppenheimer:end admin-web

# oppenheimer:begin runner
runner:
  image: ghcr.io/your-org/oppenheimer-runner:latest
  replicas: 1
  port: 3006
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # RUNNER_BOOTSTRAP_API_KEY, RUNNER_JWT_SECRET and (optionally)
  # RUNNER_DATABASE_URL come from the <release>-runner-secrets Secret, never
  # from values. Without RUNNER_DATABASE_URL the runner stays stateless.
  env:
    RUNNER_ENV: production
    ERROR_TYPE_BASE_URL: https://docs.oppenheimer.dev/errors
# oppenheimer:end runner

# oppenheimer:begin docs
docs:
  image: ghcr.io/your-org/oppenheimer-docs:latest
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
# oppenheimer:end docs

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 10Gi
  env:
    POSTGRES_USER: oppenheimer
    POSTGRES_PASSWORD: oppenheimer
    POSTGRES_DB: oppenheimer

redis:
  enabled: true
  image: redis:7-alpine
  storage: 1Gi

ingress:
  enabled: true
  className: nginx
  hosts:
    api: api.oppenheimer.dev
    # oppenheimer:begin web
    web: oppenheimer.dev
    # oppenheimer:end web
    # oppenheimer:begin admin-web
    adminWeb: control.oppenheimer.dev
    # oppenheimer:end admin-web
    # oppenheimer:begin docs
    docs: docs.oppenheimer.dev
    # oppenheimer:end docs
  tls:
    enabled: false
