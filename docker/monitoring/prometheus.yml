# Prometheus configuration for local development (docker-compose.monitoring.yml).
# The dev server's scrape config is in deploy/dev/monitoring/README.md; the
# rules are the same file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.rules.yaml

scrape_configs:
  - job_name: oppenheimer-api
    metrics_path: /api/v1/metrics
    basic_auth:
      username: prometheus
      password_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["host.docker.internal:3001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
