services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-oppenheimer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oppenheimer}
      POSTGRES_DB: ${DB_DATABASE:-oppenheimer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-oppenheimer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-ghcr.io/your-org/oppenheimer-api:latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-oppenheimer}
      DB_PASSWORD: ${DB_PASSWORD:-oppenheimer}
      DB_DATABASE: ${DB_DATABASE:-oppenheimer}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      # OAuth providers. The image does not ship the root `.env`, so anything
      # the API must read has to be forwarded here. Empty is the "not
      # configured" value — the provider simply stays off (see
      # GET /api/v1/health/capabilities).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # The LLM provider that titles sessions (see the root .env.example).
      # Empty is "none": sessions are then named from their prompt's words.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
      SESSION_NAMER_MODEL: ${SESSION_NAMER_MODEL:-}
      SESSION_NAMER_TIMEOUT_MS: ${SESSION_NAMER_TIMEOUT_MS:-}
    ports:
      - "3001:3001"

  # oppenheimer:begin web
  web:
    image: ${WEB_IMAGE:-ghcr.io/your-org/oppenheimer-web:latest}
    restart: always
    depends_on:
      - api
    # No runtime environment: the web image is a static Vite build served by
    # nginx — VITE_* values are baked in at image build time. The one runtime
    # knob is CSP_EXTRA_ORIGINS, the origins nginx's Content-Security-Policy
    # admits beyond 'self'. The image defaults it to the PostHog EU endpoints;
    # add it here only to widen that (another analytics region, or a
    # VITE_API_URL that is not this origin). Setting it replaces the default
    # rather than adding to it — see apps/web/nginx.conf.
    ports:
      - "3000:3000"
  # oppenheimer:end web

  # oppenheimer:begin docs
  docs:
    image: ${DOCS_IMAGE:-ghcr.io/your-org/oppenheimer-docs:latest}
    restart: always
    ports:
      - "3002:80"
  # oppenheimer:end docs

  # oppenheimer:begin runner
  runner:
    image: ${RUNNER_IMAGE:-ghcr.io/your-org/oppenheimer-runner:latest}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNNER_ENV: production
      RUNNER_PORT: 3006
      # Empty keeps the in-memory store; set it to persist keys.
      # A separate database on the same server keeps the runner's tables out
      # of the API's schema.
      RUNNER_DATABASE_URL: ${RUNNER_DATABASE_URL:-}
      # Required. The API authenticates to the runner with this key or one
      # minted from it; nothing else in the stack needs to know it.
      RUNNER_BOOTSTRAP_API_KEY: ${RUNNER_BOOTSTRAP_API_KEY}
      # Empty keeps service tokens off (see GET /health/capabilities).
      RUNNER_JWT_SECRET: ${RUNNER_JWT_SECRET:-}
      ERROR_TYPE_BASE_URL: ${ERROR_TYPE_BASE_URL:-https://oppenheimer.dev/errors}
    # Not published: only the API (on the compose network) talks to it.
    expose:
      - "3006"
  # oppenheimer:end runner

volumes:
  postgres_data:
  redis_data:
