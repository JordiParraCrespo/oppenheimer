# A project name of its own. Both compose files live in docker/, so without it
# they share the default name "docker" — and with it the same containers and
# the same postgres_data volume: `pnpm docker:prod` on a machine running this
# file would take over the development database.
name: oppenheimer-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oppenheimer
      POSTGRES_PASSWORD: oppenheimer
      POSTGRES_DB: oppenheimer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
