name: CI

# The pipeline is `scripts/ci/local.mjs`, and this workflow runs it: every
# job, on main, every eight hours and on demand. Pull requests get no run
# here; each carries the report of the same command, run before it was pushed
# (a run queued for a shared runner took most of an hour for a few minutes of
# work). A red run opens the `main-red` issue, and the next green run closes it.
on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:
  workflow_call:

# A scheduled run is never cancelled by the next one; it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}-ci
  cancel-in-progress: false

jobs:
  ci:
    name: CI (pnpm ci:local --all)
    runs-on: gha-vm
    permissions:
      contents: read
      issues: write
    outputs:
      images: ${{ steps.images.outputs.images }}
    # The Postgres and Redis `stack.mjs up` would start with Docker Compose,
    # which this runner lacks (it has the daemon, not the plugin); the stack
    # uses a pair that is already listening. Same ports and credentials as
    # docker/docker-compose.dev.yml and .env.example.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oppenheimer
          POSTGRES_PASSWORD: oppenheimer
          POSTGRES_DB: oppenheimer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oppenheimer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Pinned rather than left to the defaults, which read these generic names
    # from the environment a self-hosted runner may already define; `WEB_URL`
    # is the `Origin` Better Auth checks against `trustedOrigins`.
    env:
      API_URL: http://localhost:3001
      WEB_URL: http://localhost:3000
    steps:
      # The whole history, so `affected.mjs` can diff.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # oppenheimer:begin runner
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/runner/go.sum
            packages/go/*/go.sum
      # ci:local expects golangci-lint on PATH, as a contributor has it.
      - run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.5.0
      # oppenheimer:end runner
      - run: pnpm install --frozen-lockfile
      - id: images
        run: node scripts/ci/affected.mjs
      - name: pnpm ci:local --all
        run: pnpm ci:local --all
      - name: Report
        if: ${{ !cancelled() }}
        run: cat .ci-local/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Retain CI report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-report-${{ github.sha }}
          path: .ci-local/report.md
          if-no-files-found: error
      - name: Open or close the main-red issue
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job's status so far: failure once any step above failed.
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/report-main.mjs

  build-images:
    name: Build Docker Images
    runs-on: gha-vm
    # Only an image of a commit that passed every job.
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      # Every app with an image: the mapping in scripts/ci/affected.mjs.
      matrix:
        app: ${{ fromJSON(needs.ci.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          # Consumed by the Go runner image (embedded as the reported
          # version); the Node images ignore it.
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/oppenheimer-${{ matrix.app }}:latest
            ghcr.io/${{ env.REPO_LC }}/oppenheimer-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
