name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: gha-vm
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      packages: ${{ steps.scope.outputs.packages }}
      filters: ${{ steps.scope.outputs.filters }}
      images: ${{ steps.scope.outputs.images }}
    steps:
      # The whole history, so Turborepo can diff a pull request against its
      # base branch. The repository is small enough for this to cost seconds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Which packages a pull request touches, and therefore which tests and
      # images it needs. A push to main, or a change to a file no package owns
      # (this workflow, the lockfile, docker/), runs everything; see the script.
      - id: scope
        run: node scripts/ci/affected.mjs

  lint:
    name: Lint
    runs-on: gha-vm
    needs: changes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # oppenheimer:begin runner
      # `pnpm arch` runs through Turborepo, whose ^build edge now reaches
      # the Go packages, so the toolchain has to be present here as well.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/runner/go.sum
            packages/go/*/go.sum
      # oppenheimer:end runner
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # oppenheimer:begin web|admin-web|web-showcase|mobile|admin-mobile|mobile-showcase
      # The design-system linter (`@shadcn/lint` through oxlint, scoped to its
      # own rules — Biome keeps correctness) over every web and mobile app that
      # has a `lint:design` script. Every rule is at `warn` while the findings
      # it inherited are worked off, so this step reports and never fails;
      # promote a rule to `error` in the design system's oxlint.design.json
      # once it is clean.
      - name: Design-system lint
        run: pnpm lint:design
      # oppenheimer:end web|admin-web|web-showcase|mobile|admin-mobile|mobile-showcase
      # Empty filters mean "every package" to Turborepo, so an empty affected
      # list has to skip the step rather than pass nothing.
      - name: Architecture boundaries
        if: needs.changes.outputs.packages != '[]'
        run: pnpm turbo run arch ${{ needs.changes.outputs.filters }}
      # oppenheimer:begin web|admin-web|mobile|admin-mobile
      # The frontend layout contract: feature names, kind directories, the
      # route line cap, no copies of what a kit ships, and the docs every
      # package carries. Import rules are dependency-cruiser's, above.
      - name: Frontend structure
        run: pnpm check:structure
      # oppenheimer:end web|admin-web|mobile|admin-mobile
      # oppenheimer:begin starter
      # The starter's feature manifest must keep describing the repo: every
      # optional app referenced only inside its own paths or a marker block.
      - name: Starter manifest
        run: pnpm starter:check
      # oppenheimer:end starter

  # oppenheimer:begin runner
  go:
    name: Go (go.work)
    runs-on: gha-vm
    needs: changes
    # Every Go module is a workspace package, so Turborepo's affected list
    # names them; nothing here can change without one of them changing.
    if: contains(needs.changes.outputs.packages, '"@oppenheimer/go-') || contains(needs.changes.outputs.packages, '"@oppenheimer/runner"')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/runner/go.sum
            packages/go/*/go.sum
      # The workspace root is not a module, so `./...` does not resolve
      # there; the module-path pattern spans every module in go.work.
      - run: go vet github.com/jordiparracrespo/oppenheimer/...
      # golangci-lint needs directory patterns, one per module; `go list -m`
      # in workspace mode lists exactly the modules go.work declares.
      - run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.5.0
      - run: golangci-lint run $(go list -m -f '{{.Dir}}/...')
      # The gha-vm runners ship no C compiler, and -race needs cgo; run the
      # race detector locally (make test-race) and plain tests here.
      - run: go test -count=1 github.com/jordiparracrespo/oppenheimer/...
      - run: go build -trimpath ./cmd/server
        working-directory: apps/runner
  # oppenheimer:end runner

  test:
    name: Test
    runs-on: gha-vm
    needs: changes
    # Runs beside Lint rather than behind it: nothing here depends on Biome
    # passing, and the gate cost every run two and a half serial minutes.
    if: needs.changes.outputs.packages != '[]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # oppenheimer:begin runner
      # Turborepo builds and tests apps/runner through its package.json
      # scripts, so the Go toolchain has to be present here too.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/runner/go.sum
            packages/go/*/go.sum
      # oppenheimer:end runner
      - run: pnpm install --frozen-lockfile
      # The filters name the affected packages; `dependsOn: ["^build"]` still
      # builds what they import. Empty on main, where everything runs.
      - run: pnpm turbo run build ${{ needs.changes.outputs.filters }}
      - run: pnpm turbo run test ${{ needs.changes.outputs.filters }}
      # oppenheimer:begin web|admin-web
      # What a first-time visitor downloads before anything renders, against a
      # committed budget. Vite's own chunk warning prints and passes. The
      # check reads both SPAs' dist folders, so build both when either changed;
      # the one already built above is a local cache hit.
      - name: First-load budgets
        if: contains(needs.changes.outputs.packages, '"@oppenheimer/web"') || contains(needs.changes.outputs.packages, '"@oppenheimer/admin-web"')
        run: |
          filters=()
          # oppenheimer:begin web
          filters+=(--filter=@oppenheimer/web)
          # oppenheimer:end web
          # oppenheimer:begin admin-web
          filters+=(--filter=@oppenheimer/admin-web)
          # oppenheimer:end admin-web
          pnpm turbo run build "${filters[@]}"
          pnpm check:bundle
      # oppenheimer:end web|admin-web

  test-integration:
    name: Integration Tests
    runs-on: gha-vm
    needs: changes
    # apps/api is the only package with an integration suite, and Turborepo's
    # affected list already includes it whenever one of its dependencies moved.
    if: contains(needs.changes.outputs.packages, '"@oppenheimer/api"')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # oppenheimer:begin runner
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/runner/go.sum
            packages/go/*/go.sum
      # oppenheimer:end runner
      - run: pnpm install --frozen-lockfile
      # Only the API and what it imports; the full build spent most of its
      # two minutes on apps this job never runs.
      - run: pnpm turbo run build --filter=@oppenheimer/api...
      - run: pnpm test:integration

  # oppenheimer:begin e2e
  test-e2e:
    name: End-to-End Tests (API)
    runs-on: gha-vm
    needs: changes
    # The suite drives the API over HTTP and depends on nothing else in the
    # workspace, so it runs when the API (or one of its dependencies, which
    # the affected list folds into it) or the suite itself changed.
    if: contains(needs.changes.outputs.packages, '"@oppenheimer/api"') || contains(needs.changes.outputs.packages, '"@oppenheimer/e2e"')
    # The same Postgres and Redis `pnpm docker:up` starts locally, as service
    # containers: this runner has the Docker daemon but not the `docker
    # compose` plugin, and the ports and credentials below are the ones
    # docker/docker-compose.dev.yml and .env.example already agree on.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oppenheimer
          POSTGRES_PASSWORD: oppenheimer
          POSTGRES_DB: oppenheimer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oppenheimer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Pinned rather than left to `playwright.config.ts`'s defaults, which read
    # these names from the environment — generic enough for a self-hosted runner
    # to already define, and `WEB_URL` is the `Origin` every request context
    # sends, which Better Auth checks against `trustedOrigins`. Same values as
    # the defaults; the point is that the runner cannot change them.
    env:
      API_URL: http://localhost:3001
      WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite reads verification and reset tokens out of Postgres and the
      # API log rather than a mailbox, which is what `EMAIL_PROVIDER=console`
      # in .env.example gives it. `support/db.ts` reads the same root .env as
      # the API, so both necessarily agree on the database.
      - run: cp .env.example .env
      # Only what the API needs: the `api` project drives HTTP, so there is no
      # browser and no web build in this job — and therefore no Go toolchain
      # either, since nothing here reaches apps/runner.
      - run: pnpm turbo run build --filter=@oppenheimer/api...
      - run: pnpm --filter @oppenheimer/api migration:run
      - name: Start the API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3001/api/v1/health > /dev/null && exit 0
            sleep 1
          done
          echo "API never became healthy"; cat /tmp/api.log; exit 1
      # The origins Better Auth will trust, as the API process resolves them —
      # `@oppenheimer/env` lets a real environment variable win over the root .env, so
      # a runner that defines one of these generic names silently changes the
      # trusted set. Printed always, not just on failure: it is one line and it
      # is the first thing worth knowing when an auth route answers 403.
      - name: Resolved origins
        run: |
          pnpm --filter @oppenheimer/e2e exec node -e "require('@oppenheimer/env/load');console.log(JSON.stringify({FRONTEND_URL:process.env.FRONTEND_URL,ADMIN_FRONTEND_URL:process.env.ADMIN_FRONTEND_URL,BETTER_AUTH_URL:process.env.BETTER_AUTH_URL,NODE_ENV:process.env.NODE_ENV,API_URL:process.env.API_URL,WEB_URL:process.env.WEB_URL},null,2))"
      - run: pnpm --filter @oppenheimer/e2e e2e:api
      # The API log is this suite's mailbox, and it is also where Better Auth
      # writes why it refused a request. Grepped rather than tailed: the first
      # spec is the one that fails, so its request is at the top of a two-minute
      # log. The token is stripped before printing — what matters is the rest of
      # the query, and `/verify-email` answers 403 for exactly one reason, an
      # untrusted `callbackURL`.
      - name: What the API saw
        if: failure()
        run: |
          echo "--- verification links (token stripped)"
          grep -o 'verify-email?[^ ]*' /tmp/api.log | sed 's/token=[^&]*/token=REDACTED/' | sort -u | head -n 5
          echo "--- refusals"
          grep -nE 'Invalid (callbackURL|origin|redirectURL)|Current list of trustedOrigins|Better Auth' /tmp/api.log | head -n 20
          echo "--- api log (head)"
          head -n 60 /tmp/api.log
  # oppenheimer:end e2e

  build-images:
    name: Build Docker Images
    runs-on: gha-vm
    needs:
      - changes
      # Lint no longer gates the test jobs, so it is listed here on its own:
      # an image still waits for Biome, the architecture rules and the
      # starter manifest to pass.
      - lint
      - test
      - test-integration
      # oppenheimer:begin e2e
      - test-e2e
      # oppenheimer:end e2e
      # oppenheimer:begin runner
      - go
      # oppenheimer:end runner
    # `needs` alone would skip this job whenever one of the test jobs was
    # skipped for having nothing to do; wait for them all, then require that
    # none failed and that some image is affected at all.
    if: |
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && needs.changes.outputs.images != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      # The apps whose package (or a dependency of it) changed, from the
      # mapping in scripts/ci/affected.mjs; every app on main.
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          # Consumed by the Go runner image (embedded as the reported
          # version); the Node images ignore it.
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.REPO_LC }}/oppenheimer-${{ matrix.app }}:latest
            ghcr.io/${{ env.REPO_LC }}/oppenheimer-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
