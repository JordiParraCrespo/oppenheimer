name: Deploy dev

# Every push to main, built here and only run on the dev server: the server
# pulls the images this workflow pushed and pins them by digest, and never
# builds anything. The server side is deploy/dev (README.md there is the
# runbook). Pull requests carry their `pnpm ci:local` report, so main is what
# was reviewed; the scheduled CI run still re-checks it every eight hours.
#
# Off until the server exists: set the repository variable
# DEV_DEPLOY_ENABLED=true once deploy/dev/README.md's setup is done.
on:
  push:
    branches: [main]
  workflow_dispatch:

# No run-level concurrency: a push builds while an earlier push deploys. Each
# job holds its own lock instead (see build and deploy), and together they
# keep pushes in order: a newer push's build cancels the older one's, so an
# older push never reaches the deploy lock after a newer one.

jobs:
  build:
    name: Build ${{ matrix.image }}
    # Main only, whatever the trigger: a dispatch from another branch builds
    # and ships nothing, with or without the environment's branch rule.
    if: vars.DEV_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: gha-vm
    # One build per image: a newer push cancels the older push's build, and
    # a run with a cancelled build never deploys.
    concurrency:
      group: deploy-dev-build-${{ matrix.image }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: .
            file: apps/api/Dockerfile
          # oppenheimer:begin web
          - image: web
            context: .
            file: apps/web/Dockerfile
          # oppenheimer:end web
          # The dump sidecar: Postgres client tools plus age.
          - image: backup
            context: deploy/dev/backup
            file: deploy/dev/backup/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged by commit only; `:latest` stays the scheduled CI run's. The
      # server is x86: Hetzner CX/CPX, not the Arm CAX line.
      #
      # The layer cache lives in GHCR beside the image, as `:buildcache-dev`.
      # The runners are fresh VMs with no local cache, and the Actions cache
      # downloaded at 2-5 MB/s there (about 9 of the API's 10 minutes); GHCR
      # answers the same host at 17-50 MB/s. Only this job, on main, holds
      # `packages: write`, so a pull request's job cannot seed the cache main
      # deploys from. `mode=max` keeps the build stages' layers too (the
      # 600 MB dependency install is one), not just the final image's;
      # `image-manifest=true,oci-mediatypes=true` stores the cache as a plain
      # OCI image manifest, the form GHCR accepts for a cache.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: ghcr.io/${{ env.REPO_LC }}/oppenheimer-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/oppenheimer-${{ matrix.image }}:buildcache-dev
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LC }}/oppenheimer-${{ matrix.image }}:buildcache-dev,mode=max,image-manifest=true,oci-mediatypes=true

  deploy:
    name: Deploy to the dev server
    needs: build
    if: vars.DEV_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: gha-vm
    # One deploy at a time, and none cancelled halfway through a migration.
    # GitHub keeps one waiting job per group, so a deploy still waiting is
    # cancelled when a newer push's deploy arrives; `cancel-in-progress` is
    # about the running one.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    # Holds the secrets below; restrict it to `main` in the repository's
    # environment settings so no other branch can reach the server.
    environment:
      name: dev
      url: ${{ vars.DEV_URL }}
    permissions:
      contents: read
      # The server pulls with this job's token, which expires with the job.
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Joins the tailnet as an ephemeral node tagged tag:ci. The tailnet
      # policy lets tag:ci reach tag:oppenheimer-dev on port 22 and nothing
      # else (deploy/dev/README.md has the ACL).
      #
      # Userspace networking, not tailscale/github-action: the gha-vm runners
      # are throwaway VMs whose user has no passwordless sudo, and the action
      # installs tailscaled as root. Here tailscaled runs as the job's user
      # with no TUN device, and SSH reaches the server through `tailscale nc`.
      # The OAuth client secret is accepted as an auth key for a tagged node.
      - name: Join the tailnet (userspace, as tag:ci)
        env:
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEV_SSH_HOST: ${{ vars.DEV_SSH_HOST }}
          TS_VERSION: 1.94.2
        run: |
          ts="$RUNNER_TEMP/tailscale"
          mkdir -p "$ts"
          tgz="tailscale_${TS_VERSION}_amd64.tgz"
          curl -fsSL "https://pkgs.tailscale.com/stable/$tgz" -o "$ts/$tgz"
          want="$(curl -fsSL "https://pkgs.tailscale.com/stable/$tgz.sha256" | awk '{print $1}')"
          echo "$want  $ts/$tgz" | sha256sum -c -
          tar -xzf "$ts/$tgz" -C "$ts" --strip-components=1
          "$ts/tailscaled" --tun=userspace-networking --state=mem: \
            --socket="$ts/tailscaled.sock" --statedir="$ts/state" > "$ts/tailscaled.log" 2>&1 &
          for _ in $(seq 1 30); do [ -S "$ts/tailscaled.sock" ] && break; sleep 1; done
          "$ts/tailscale" --socket="$ts/tailscaled.sock" up --timeout=2m \
            --auth-key="${TS_OAUTH_SECRET}?ephemeral=true&preauthorized=true" \
            --advertise-tags=tag:ci --hostname="ci-deploy-dev-${GITHUB_RUN_ID}"
          echo "TS=$ts/tailscale --socket=$ts/tailscaled.sock" >> "$GITHUB_ENV"
          # Fail here, not in the deploy, if the ACL does not let tag:ci in.
          # `tailscale nc` closes the connection when its stdin ends, so hold
          # stdin open long enough for the server's SSH banner to arrive; and
          # retry, since the first WireGuard handshake can still be under way.
          for _ in 1 2 3 4 5; do
            if (sleep 5) | timeout 10 "$ts/tailscale" --socket="$ts/tailscaled.sock" nc "$DEV_SSH_HOST" 22 \
                | head -c 64 | grep -q '^SSH-'; then
              echo "$DEV_SSH_HOST:22 answers over the tailnet as tag:ci"
              exit 0
            fi
            sleep 3
          done
          tail -20 "$ts/tailscaled.log"
          echo "::error::$DEV_SSH_HOST:22 is not reachable as tag:ci"
          exit 1

      - name: SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEV_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      # The bundle is deploy/dev at this commit plus the token; the server's
      # deploy gate accepts nothing else. The token goes in the tarball, not
      # on a command line where `ps` would show it.
      - name: Deploy ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_SSH_HOST: ${{ vars.DEV_SSH_HOST }}
        run: |
          bundle="$(mktemp -d)"
          cp -a deploy/dev "$bundle/deploy"
          ( umask 077; printf '%s\n' "$GH_TOKEN" > "$bundle/registry-token" )
          tar -czf - -C "$bundle" deploy registry-token \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                  -o ProxyCommand="$TS nc %h %p" \
                  -o ConnectTimeout=30 -o ServerAliveInterval=30 \
                  "deploy@$DEV_SSH_HOST" "deploy $GITHUB_SHA"
          rm -rf "$bundle"

      - name: Leave the tailnet
        if: always() && env.TS != ''
        run: $TS logout || true

      # From outside, through Cloudflare's edge and the tunnel to nginx, the
      # API, Postgres and Redis: the one path the server cannot check itself.
      - name: Public readiness check
        env:
          DEV_URL: ${{ vars.DEV_URL }}
        run: |
          if [ -z "$DEV_URL" ]; then
            echo "::error::the dev environment has no DEV_URL variable"
            exit 1
          fi
          for _ in $(seq 1 12); do
            curl -fsS --max-time 10 "$DEV_URL/api/v1/ready" && exit 0
            sleep 5
          done
          echo "::error::$DEV_URL/api/v1/ready did not answer after the deploy"
          exit 1
