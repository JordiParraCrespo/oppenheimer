id: AUTH-05
title: A self-service registration is told where it stands
theme: auth
severity: critical
fixture: reset
tags: [onboarding, first-run]

coverage:
  primary:
    - auth.registration-first-run
    - auth.onboarding-first-workspace
  secondary:
    - mail.verification-delivery

intent: >-
  The first screen after registering is the one a product is most likely to get
  wrong in the least forgivable way: a refusal, an empty shell, or a dashboard
  of confident zeroes belonging to a workspace that does not exist. The repo
  states the intended behaviour plainly — sign-up creates an account, not a
  workspace, and an org-less account goes to onboarding — so this scenario also
  checks the database against that claim rather than against the screen.

docsRefs:
  - CLAUDE.md
codeRefs:
  - apps/web/src/routes/_auth/register.tsx
  - apps/web/src/routes/onboarding.tsx
  - apps/api/src/organizations/organizations.controller.ts

preconditions:
  - 'The `reset` fixture, so the newcomer can register again.'

steps:
  - Register a new account through the registration form.
  - Follow wherever the app sends it, and read the screen.
  - Count the memberships the database holds for the new account.
  - Create the first workspace, then sign out and sign in again.

expected:
  - Registering signs the account in and lands it on onboarding, which says
    plainly that it is in no workspace yet and what happens next.
  - The database agrees with the screen about whether a workspace exists. If
    sign-up provisions one, the scenario records that as a finding against the
    documented behaviour rather than quietly passing.
  - Onboarding refuses an empty workspace name before asking the server.
  - Creating the workspace lands on the dashboard, and the second sign-in skips
    onboarding entirely.

artifacts:
  - auth-05-registered.png
  - auth-05-onboarding.png
  - auth-05-first-dashboard.png
