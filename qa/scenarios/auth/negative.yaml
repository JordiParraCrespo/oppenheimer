id: AUTH-04
title: Bad credentials, bad links and bad input all fail legibly
theme: auth
severity: high
fixture: reset
tags: [negative, error-handling, security]

coverage:
  primary:
    - auth.sign-in-rejection
    - auth.form-validation
    - auth.guarded-route-redirect

intent: >-
  The negative paths are where a product either explains itself or blames the
  reader. Each case here has a wrong answer that is easy to ship: a raw 401
  body, a stack trace, a spinner that never resolves, or a message that tells an
  attacker which half of the credential pair was right.

docsRefs:
  - .agents/rules/frontend-ui.md
codeRefs:
  - apps/web/src/routes/_auth/login.tsx
  - apps/web/src/routes/_authenticated.tsx
  - apps/api/src/auth/auth.ts

cases:
  - id: AUTH-04a
    case: Sign in with a correct address and a wrong password.
    expected: >-
      A human-readable rejection is rendered in the form; the reader stays on
      the login screen; the message does not distinguish "no such user" from
      "wrong password".
  - id: AUTH-04b
    case: Sign in with an address that has no account.
    expected: The same rejection, with no account enumeration.
  - id: AUTH-04c
    case: Submit the login form with an obviously malformed address.
    expected: >-
      Field-level validation stops it in the browser; no request is made; the
      message names the field.
  - id: AUTH-04d
    case: Open the reset screen with a token that was never issued.
    expected: The invalid-link state, offering a way to request a new one.
  - id: AUTH-04e
    case: Open the accept-invitation screen with no id or email in the URL.
    expected: The invalid-link state, not a form that will fail on submit.
  - id: AUTH-04f
    case: Request an authenticated page while signed out, with search params.
    expected: >-
      A redirect to the login screen carrying the intended destination, so
      signing in resumes rather than restarts, with the params intact.

expected:
  - No case renders a raw status code, a stack trace, or an empty screen.
  - No case leaves a spinner running.

artifacts:
  - auth-04a-wrong-password.png
  - auth-04b-unknown-account.png
  - auth-04c-malformed-email.png
  - auth-04d-invalid-reset-token.png
  - auth-04e-invalid-invitation-link.png
  - auth-04f-guarded-route-redirect.png
