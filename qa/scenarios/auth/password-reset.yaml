id: AUTH-02
title: A member resets a forgotten password and signs in with the new one
theme: auth
severity: critical
fixture: reset
tags: [mail, credentials]

coverage:
  primary:
    - auth.password-reset-flow
    - auth.password-reset-link-single-use
  secondary:
    - mail.password-reset-delivery
    - session.revocation-on-password-reset

intent: >-
  Password reset is the flow with the most ways to be half-right. The mail can
  send and the link can 404; the new password can work and the old one keep
  working beside it; the link can be replayable; and the sessions open on other
  devices can survive a reset that exists precisely because the reader believes
  their credential is compromised.

docsRefs:
  - e2e/README.md
codeRefs:
  - apps/api/src/auth/auth.ts
  - apps/web/src/routes/_auth/forgot-password.tsx
  - apps/web/src/routes/_auth/reset-password.tsx

preconditions:
  - 'The `reset` fixture, so the transient member can be created again.'
  - '`EMAIL_PROVIDER=console`, so the reset link lands in the mail sink.'

steps:
  - Create the member, sign in once so there is a session to lose, and sign out.
  - Request a reset from the forgot-password screen.
  - Take the mail-sink count first, then wait for one more link than that.
  - Open the link, set a new password, and sign in with it.
  - Try the old password, and open the same link a second time.

expected:
  - The request screen confirms without disclosing whether the account exists.
  - The link lands on the reset screen with a token, and the form refuses a
    password below the minimum length in the browser.
  - The new password signs in; the old one is refused with the same legible
    rejection as any wrong password.
  - The link cannot be replayed - a second visit shows the invalid-link state.
  - Every session opened before the reset is gone from the database.

artifacts:
  - auth-02-reset-requested.png
  - auth-02-reset-form.png
  - auth-02-signed-in-with-new-password.png
  - auth-02-replayed-link.png
