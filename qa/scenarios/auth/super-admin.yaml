id: AUTH-01
title: A super admin exists, signs in, and reaches the control plane
theme: auth
severity: critical
fixture: reset
tags: [smoke, platform-admin]

coverage:
  primary:
    - authz.platform-admin-elevation
  secondary:
    - auth.sign-in-credentials
    - authz.permission-catalog

intent: >-
  "A super admin exists" is a claim about a row. This scenario asks the harder
  question: is the account actually elevated, or merely named that way. The two
  come apart easily — a seeded role string with a thin permission set behind it
  reads identically on the profile screen and grants nothing.

docsRefs:
  - AUTHORIZATION.md
  - .agents/rules/rbac-roles.md
codeRefs:
  - apps/api/src/database/seed.ts
  - apps/admin-web/src/routes/_authenticated.tsx

preconditions:
  - The platform seed has run, so `superadmin@oppenheimer.dev` exists.

steps:
  - Sign in as the seeded super admin on the consumer app.
  - Read the profile the API returns for the session.
  - Read `/users/me/permissions` and check the rules, not the role name.
  - Sign in again on the control plane and open the users screen.

expected:
  - The session belongs to the seeded super admin, and `user.role` in the
    database says `superadmin`.
  - The permission set grants unrestricted access (`manage all`), rather than a
    suggestive name over a handful of rules.
  - The control plane admits them and lists the seeded accounts.

artifacts:
  - auth-01-superadmin-dashboard.png
  - admin-auth-01-superadmin-users.png
