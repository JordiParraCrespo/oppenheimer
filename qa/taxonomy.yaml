# Coverage ids a scenario is allowed to claim.
#
# Borrowed from OpenClaw's `taxonomy.yaml`, which the CRM port dropped. The
# point is not bookkeeping: it is that `qa coverage --match <path>` can answer
# "which scenario proves this file still works" after someone touches it. An id
# is `surface.feature`, lowercase, dashes inside a segment, and behaviour-shaped
# rather than named after the scenario that happens to prove it first.
#
# A scenario names ids under `coverage.primary` only when it executes the
# product boundary that id is about. Supporting evidence goes under
# `coverage.secondary`, which may stand alone.
version: 1

surfaces:
  auth:
    title: Authentication
    features:
      - auth.sign-in-credentials
      - auth.sign-in-rejection
      - auth.sign-out
      - auth.registration-first-run
      - auth.onboarding-first-workspace
      - auth.password-reset-flow
      - auth.password-reset-link-single-use
      - auth.invitation-accept-role
      - auth.guarded-route-redirect
      - auth.form-validation

  session:
    title: Sessions and credentials
    features:
      - session.revocation-on-sign-out
      - session.revocation-on-password-reset
      - session.cookie-hardening

  authz:
    title: Roles, permissions and tenancy
    features:
      - authz.platform-admin-elevation
      - authz.control-plane-gate
      - authz.tenant-isolation-read
      - authz.permission-catalog

  mail:
    title: Transactional mail
    features:
      - mail.password-reset-delivery
      - mail.invitation-delivery
      - mail.verification-delivery
